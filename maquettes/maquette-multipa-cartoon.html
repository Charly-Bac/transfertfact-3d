<style>
/* Layout : header blanc avec le menu du site, film 3D plein cadre dessous, texte à gauche (en bas sur mobile), timeline de chapitres en pied. Identité du site : blanc, vert, turquoise, jaune. */
:root{
  --bg:#ffffff; --mist:#f2f7f4; --line:#e2eae5; --ink:#444444; --text:#6a6a6a; --deep:#032b2a;
  --green:#4aac35; --green-d:#3c940c; --teal:#4ebbb7; --teal-d:#086666; --yellow:#ffd43a;
  --f-title:"Sometype Mono",ui-monospace,Menlo,monospace;
  --f-body:"Roboto",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;overflow:hidden}
.app{height:100%;display:grid;grid-template-rows:auto 1fr}

/* Header du site */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;height:56px;background:var(--bg);border-bottom:1px solid var(--line);z-index:6;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));min-width:0}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink);flex:none}
.logo svg{width:26px;height:26px}
.logo span{font:500 19px var(--f-title);letter-spacing:-1px}
.logo b{color:var(--green);font-weight:700}
.logo small{font:400 10.5px var(--f-body);color:var(--text);border:1px solid var(--line);border-radius:3px;padding:1px 6px;margin-left:4px;letter-spacing:.02em}
.menu{display:flex;align-items:stretch;height:100%;overflow-x:auto;scrollbar-width:none;min-width:0}
.menu::-webkit-scrollbar{display:none}
.menu a{display:flex;align-items:center;gap:6px;padding:0 13px;font:400 13.5px var(--f-body);color:var(--ink);text-decoration:none;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.menu a:hover{color:var(--green)}
.menu a.on{color:var(--green);border-bottom-color:var(--green);font-weight:500}
.menu a svg{width:12px;height:12px;fill:currentColor}
a:focus-visible,button:focus-visible{outline:2px solid var(--green);outline-offset:2px}

.stage{position:relative;overflow:hidden;min-height:0;background:var(--mist)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.veil{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(255,255,255,.95) 0%,rgba(255,255,255,.78) 27%,rgba(255,255,255,0) 43%)}
.fade{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .3s;z-index:7}
.fade.on{opacity:1}
.loading[hidden]{display:none}
.loading{position:absolute;inset:0;display:grid;place-items:center;font:500 13px var(--f-title);color:var(--text)}

.copy{position:absolute;left:max(44px,env(safe-area-inset-left,0px));top:50%;transform:translateY(-55%);width:min(480px,40vw);z-index:4}
.kick{font:500 12px var(--f-title);letter-spacing:.04em;color:var(--green);margin:0 0 14px;display:flex;align-items:center;gap:10px;text-transform:uppercase}
.kick em{font-style:normal;color:var(--text)}
.kick i{display:inline-block;width:10px;height:10px;background:var(--yellow);transform:rotate(12deg)}
.copy h2{font:700 clamp(27px,3.1vw,44px)/1.18 var(--f-title);letter-spacing:-2px;word-spacing:-4px;color:var(--ink);margin:0;text-wrap:balance}
.copy h2 .w{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.06em;margin-bottom:-.06em}
.copy h2 .w>span{display:inline-block;transform:translateY(105%);transition:transform .75s cubic-bezier(.2,.8,.2,1)}
.copy h2 .g{color:var(--green);font-weight:700}
.copy .lead{color:var(--text);font-size:16px;margin:18px 0 0;max-width:46ch;opacity:0;transform:translateY(10px);transition:opacity .7s .35s,transform .7s .35s;text-wrap:pretty}
.copy .lead strong{color:var(--ink);font-weight:700}
.copy ul{list-style:none;padding:0;margin:20px 0 0;display:grid;gap:9px}
.copy li{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;opacity:0;transform:translateX(-12px);transition:opacity .6s,transform .6s;color:var(--ink)}
.copy li svg{width:20px;height:20px;margin-top:1px}
.copy .ctas{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px;opacity:0;transition:opacity .7s 1s}
.copy.show h2 .w>span{transform:none}
.copy.show .lead,.copy.show li{opacity:1;transform:none}
.copy.show .ctas{opacity:1}
.copy.out{opacity:0;transition:opacity .45s}
.btn{display:inline-flex;align-items:center;gap:7px;font:500 14px var(--f-body);text-decoration:none;border-radius:3px;padding:11px 18px;border:1px solid var(--green);color:var(--green);background:#fff;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--mist)}
.btn.primary{background:var(--green);color:#fff}
.btn.primary:hover{background:var(--green-d);border-color:var(--green-d)}

.labels{position:absolute;inset:0;pointer-events:none;z-index:3}
.lbl{position:absolute;left:0;top:0;font:500 12.5px var(--f-body);white-space:nowrap;padding:6px 12px 6px 9px;border-radius:999px;background:#fff;color:var(--ink);
  display:flex;gap:8px;align-items:center;opacity:0;transition:opacity .45s;box-shadow:0 4px 14px rgba(3,43,42,.12),0 0 0 1px var(--line)}
.lbl::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c,var(--green))}
.lbl.on{opacity:1}
.lbl.big{font:700 13px var(--f-title);letter-spacing:-.5px;padding:8px 14px 8px 11px}

.bar{position:absolute;left:0;right:0;bottom:0;z-index:5;display:flex;align-items:center;gap:16px;background:linear-gradient(0deg,rgba(255,255,255,.97) 55%,rgba(255,255,255,0));
  padding-block:22px 16px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.play{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:var(--green);color:#fff;cursor:pointer;display:grid;place-items:center;box-shadow:0 4px 12px rgba(74,172,53,.35)}
.play svg{width:15px;height:15px;fill:currentColor}
.segs{flex:1;display:flex;gap:6px;min-width:0}
.seg{min-width:0;background:none;border:0;padding:8px 0 0;cursor:pointer;text-align:left;color:var(--text)}
.seg .track{display:block;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.seg .fill{display:block;height:100%;width:0;background:var(--green)}
.seg .t{display:block;font:500 11.5px var(--f-title);letter-spacing:-.3px;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg[aria-current="true"] .t{color:var(--green)}
.seg:hover .t{color:var(--ink)}
.tc{flex:none;font:400 12px var(--f-title);color:var(--text);font-variant-numeric:tabular-nums;min-width:96px;text-align:right}

@media (max-width:820px){
  .logo small{display:none}
  .top{gap:10px}
  .veil{background:linear-gradient(0deg,rgba(255,255,255,.98) 0%,rgba(255,255,255,.9) 44%,rgba(255,255,255,0) 64%)}
  .copy{left:max(18px,env(safe-area-inset-left,0px));right:max(18px,env(safe-area-inset-right,0px));top:auto;bottom:76px;transform:none;width:auto}
  .copy h2{font-size:24px;letter-spacing:-1.5px}
  .copy .lead{font-size:14.5px;margin-top:10px}
  .copy ul{margin-top:12px;gap:5px;font-size:14px}
  .copy .ctas{margin-top:14px}
  .seg .t,.tc{display:none}
  .segs{gap:4px}
}
@media (max-height:640px) and (min-width:821px){.copy ul{display:none}}
@media (prefers-reduced-motion:reduce){.copy h2 .w>span,.copy .lead,.copy li,.copy .ctas{transition:none}}
</style>

let fitK=1;const ZOOM=.76;

function camAt(T,oP,oL){let k=CH.findIndex(c=>T<c.end);if(k<0)k=CH.length-1;const c=CH[k],last=k===CH.length-1,ts=c.end-TR;
  if(T<ts||last){const u=clamp((T-c.start)/(last?c.dur:c.dur-TR));const e=eio(u)*.55+u*.45;const A=keyCam(k,"a"),B=keyCam(k,"b");oP.lerpVectors(A.pos,B.pos,e);oL.lerpVectors(A.look,B.look,e);return {k,travel:false};}
  const u=eio(clamp((T-ts)/TR));const A=keyCam(k,"b"),B=keyCam(k+1,"a");const ctrl=A.pos.clone().lerp(B.pos,.5).add(V(0,1.6,1.2));const q=1-u;
  oP.copy(A.pos).multiplyScalar(q*q).addScaledVector(ctrl,2*q*u).addScaledVector(B.pos,u*u);oL.lerpVectors(A.look,B.look,u);return {k,travel:true};}

/* matériaux toon : 3 paliers de lumière, couleurs plus franches, textures conservées */
const GRAD=(()=>{const v=[120,190,255],d=new Uint8Array(v.length*4);v.forEach((x,i)=>{d.set([x,x,x,255],i*4);});const t=new THREE.DataTexture(d,v.length,1,THREE.RGBAFormat);
  t.minFilter=t.magFilter=THREE.NearestFilter;t.generateMipmaps=false;t.needsUpdate=true;return t;})();
function toonify(){const cache=new Map(),hsl={};
  const conv=m=>{if(!m||!m.isMeshStandardMaterial)return m;if(cache.has(m))return cache.get(m);
    const glass=m.transmission>0;
    const t=new THREE.MeshToonMaterial({color:m.color.clone(),map:m.map||null,gradientMap:GRAD,side:m.side,shadowSide:m.shadowSide,
      transparent:m.transparent||glass,opacity:glass?.32:m.opacity,depthWrite:glass?false:m.depthWrite,emissive:m.emissive.clone(),emissiveMap:m.emissiveMap||null,
      polygonOffset:m.polygonOffset,polygonOffsetFactor:m.polygonOffsetFactor,polygonOffsetUnits:m.polygonOffsetUnits});
    if(glass)t.color.set(0xdff4ee);
    if(!t.map){t.color.getHSL(hsl);t.color.setHSL(hsl.h,Math.min(1,hsl.s*1.25),hsl.l);}
    if(m.metalness>.5&&hsl.l>.3)t.color.multiplyScalar(1.08);
    if(t.transparent||m.userData.noAO)t.userData.outlineParameters={visible:false};
    cache.set(m,t);return t;};
  scene.traverse(o=>{if(o.isMesh)o.material=Array.isArray(o.material)?o.material.map(conv):conv(o.material);
    if(o.isMesh&&o.material&&o.material.isMeshBasicMaterial)o.material.userData.outlineParameters={visible:false};});
  const edges=new Map(),ink=new THREE.LineBasicMaterial({color:0x232826});const flat=[];
  scene.traverse(o=>{if(o.isMesh&&o.geometry.type==="PlaneGeometry"&&o.material.isMeshToonMaterial&&!o.material.transparent&&o.material.side!==THREE.BackSide)flat.push(o);});
  flat.forEach(o=>{if(!edges.has(o.geometry))edges.set(o.geometry,new THREE.EdgesGeometry(o.geometry,25));const l=new THREE.LineSegments(edges.get(o.geometry),ink);l.raycast=()=>{};o.add(l);});}

  if(composer){composer.setPixelRatio(pr);composer.setSize(W,H);if(ssao)ssao.setSize(W*pr,H*pr);}if(finish)finish.uniforms.res.value.set(W*pr,H*pr);

  if(W<=820){const offY=Math.max(0,Math.min(H*.6,sr.bottom-cr.top+8));camera.aspect=W/(H+offY);camera.setViewOffset(W,H+offY,0,offY,W,H);visA=W/Math.max(1,H-offY);}
  else{const offX=Math.min(W*.42,cr.right-sr.left+30);camera.aspect=(W+offX)/H;camera.setViewOffset(W+offX,H,0,0,W,H);visA=(W-offX)/H;}

  try{mobile=stage.clientWidth<=820;initMaterials();buildEnv();st0(CH[0].x);st1(CH[1].x);st2(CH[3].x,3);st3(CH[4].x,4);st4(CH[5].x,5);st5(CH[6].x,6);toonify();setupPost();
    scene.traverse(o=>{if(o.isMesh&&o.material&&!o.material.isMeshBasicMaterial&&o.material.envMapIntensity===1)o.material.envMapIntensity=o.material===M.alu||o.material===M.chrome||o.material===M.aluDark?.9:.5;});}
  catch(err){console.error(err);ld.textContent="La scène 3D n'a pas pu se charger : le texte reste lisible.";return;}
  ld.hidden=true;layout();new ResizeObserver(layout).observe(stage);
  const clock=new THREE.Clock(),cP=V(0,0,0),cL=V(0,0,0),pv=V(0,0,0),hand=V(0,0,0);
  let qf=0,qt=0,qLvl=location.hash==="#hq"?2:0;
  function adapt(rawDt){if(qLvl>=2)return;qf++;qt+=rawDt;if(qf<90)return;const avg=qt/qf;qf=0;qt=0;
    if(avg>1/36){qLvl++;if(qLvl===1&&ssao){ssao.enabled=false;basePass.enabled=true;}else{if(bokeh)bokeh.enabled=false;if(bloom)bloom.enabled=false;prCap=1.25;layout();qLvl=2;}}else qLvl=2;}
  (function loop(){const raw=clock.getDelta();const dt=Math.min(raw,.05);if(composer&&!document.hidden)adapt(raw);
    if(playing){T+=dt;if(T>=TOTAL){T=0;curK=-1;fade.classList.add("on");setTimeout(()=>fade.classList.remove("on"),300);}}
    const st=camAt(T,cP,cL);
    
    camera.position.copy(cP);camera.lookAt(cL);
    keyLight.position.copy(cL).add(V(-7,16,9));keyLight.target.position.copy(cL);
    if(st.k!==curK){curK=st.k;showCopy(curK);}
    if(st.travel!==traveling){traveling=st.travel;copy.classList.toggle("out",traveling);}
    updaters.forEach(f=>f(T));
    CH.forEach((c,i)=>{c.fill.style.width=(i<curK?100:i>curK?0:clamp((T-c.start)/c.dur)*100)+"%";});
    tc.textContent=fmt(T)+" / "+fmt(TOTAL);
    labels.forEach(l=>{const on=l.ch===curK&&!traveling&&(T-CH[l.ch].start)>.8;pv.copy(l.pos).project(camera);
      if(on&&pv.z<1)l.el.style.transform=`translate(${(pv.x+1)/2*W}px,${(1-pv.y)/2*H}px) translate(-50%,-50%)`;l.el.classList.toggle("on",on&&pv.z<1);});
    if(composer){if(bokeh)bokeh.uniforms.focus.value=cP.distanceTo(cL);finish.uniforms.time.value=clock.elapsedTime;composer.render(dt);}else if(outline)outline.render(scene,camera);else renderer.render(scene,camera);
    requestAnimationFrame(loop);})();
});
})();
</script>
